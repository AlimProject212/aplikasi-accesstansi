[build]
builder = "NIXPACKS"

[deploy]
# Schema sudah dibuat manual via phpMyAdmin (import schema.sql)
# prisma generate: generate Prisma Client dari schema.prisma
startCommand = "npm run build && npx prisma generate && node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
